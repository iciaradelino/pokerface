# Local Docker Compose only. Serves the built app and sends every unknown path to index.html,
# so routes like /lobby work on reload.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
